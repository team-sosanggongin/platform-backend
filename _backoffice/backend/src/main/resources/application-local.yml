spring:
  datasource:
    url: jdbc:h2:mem:backoffice-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
#  sql:
#    init:
#      mode: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}